<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Restablecer contraseña — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container" style="max-width: 420px;">
		<div class="card mt-5 shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4 text-center">Restablecer contraseña</h1>
				<div th:unless="${tokenValido}" class="alert alert-danger py-2">El enlace de recuperación no es válido o ya expiró.</div>
				<form th:if="${tokenValido}" th:action="@{/restablecer}" method="post" th:object="${formulario}" novalidate>
					<input type="hidden" name="token" th:value="${token}">
					<div class="mb-3">
						<label for="contrasena" class="form-label">Contraseña nueva</label>
						<input type="password" class="form-control" id="contrasena" th:field="*{contrasena}">
						<div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
						<div class="text-danger small" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
					</div>
					<button type="submit" class="btn btn-primary w-100">Restablecer contraseña</button>
				</form>
				<a class="d-block text-center small mt-3" th:href="@{/login}">Volver a iniciar sesión</a>
			</div>
		</div>
	</div>
</body>
</html>
