<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Proveedores — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h4 mb-0">Proveedores</h1>
			<a class="btn btn-primary btn-sm" th:href="@{/proveedores/nuevo}"
					sec:authorize="hasRole('COMPRADOR')">Registrar proveedor</a>
		</div>

		<div class="alert alert-success" th:if="${param.creado}">
			Proveedor registrado.
		</div>

		<div class="alert alert-info" th:if="${proveedores.isEmpty()}">
			No hay proveedores registrados
		</div>

		<div class="card shadow-sm" th:unless="${proveedores.isEmpty()}">
			<table class="table table-striped align-middle mb-0">
				<thead>
					<tr>
						<th>Nombre</th>
						<th>NIT</th>
						<th>Teléfono</th>
						<th>Correo</th>
						<th>Dirección</th>
						<th>Estado</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="proveedor : ${proveedores}">
						<td th:text="${proveedor.nombre}"></td>
						<td th:text="${proveedor.nit}"></td>
						<td th:text="${proveedor.telefono}"></td>
						<td th:text="${proveedor.correo}"></td>
						<td th:text="${proveedor.direccion}"></td>
						<td>
							<span class="badge bg-success" th:if="${proveedor.activo}">Activo</span>
							<span class="badge bg-secondary" th:unless="${proveedor.activo}">Inactivo</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
