<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrar proveedor — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4" style="max-width: 560px;">
		<h1 class="h4 mb-3">Registrar proveedor</h1>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/proveedores/nuevo}" th:object="${formulario}" method="post" novalidate>
					<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
						<div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
					</div>
					<div class="mb-3">
						<label for="nombre" class="form-label">Nombre</label>
						<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
						<div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
					</div>
					<div class="mb-3">
						<label for="nit" class="form-label">NIT</label>
						<input type="text" class="form-control" id="nit" th:field="*{nit}">
						<div class="text-danger small" th:if="${#fields.hasErrors('nit')}" th:errors="*{nit}"></div>
					</div>
					<div class="mb-3">
						<label for="telefono" class="form-label">Teléfono</label>
						<input type="text" class="form-control" id="telefono" th:field="*{telefono}">
						<div class="form-text">Teléfono o correo: al menos uno es obligatorio.</div>
					</div>
					<div class="mb-3">
						<label for="correo" class="form-label">Correo</label>
						<input type="text" class="form-control" id="correo" th:field="*{correo}">
						<div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
					</div>
					<div class="mb-3">
						<label for="direccion" class="form-label">Dirección</label>
						<input type="text" class="form-control" id="direccion" th:field="*{direccion}">
					</div>
					<button type="submit" class="btn btn-primary">Registrar proveedor</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
