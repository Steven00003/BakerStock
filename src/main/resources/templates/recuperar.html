<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Recuperar contraseña — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container" style="max-width: 420px;">
		<div class="card mt-5 shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4 text-center">Recuperar contraseña</h1>
				<div th:if="${mensaje}" class="alert alert-info py-2" th:text="${mensaje}"></div>
				<form th:action="@{/recuperar}" method="post">
					<div class="mb-3">
						<label for="correo" class="form-label">Correo</label>
						<input type="email" class="form-control" id="correo" name="correo" required>
					</div>
					<button type="submit" class="btn btn-primary w-100">Solicitar recuperación</button>
					<a class="d-block text-center small mt-3" th:href="@{/login}">Volver a iniciar sesión</a>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
