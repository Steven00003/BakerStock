<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${insumo.nombre} + ' — BakerStock'"></title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4" th:with="unidad=${insumo.unidadBase.name() == 'G' ? 'g' : (insumo.unidadBase.name() == 'ML' ? 'ml' : 'unidad')}">
		<h1 class="h4 mb-1" th:text="${insumo.nombre}"></h1>
		<p class="text-muted">
			Categoría: <span th:text="${insumo.categoria.name()}"></span> ·
			Unidad base: <span th:text="${unidad}"></span> ·
			Stock mínimo: <span th:text="${insumo.stockMinimo.stripTrailingZeros().toPlainString() + ' ' + unidad}"></span>
		</p>

		<div class="row g-3 mb-4">
			<div class="col-md-3">
				<div class="card shadow-sm">
					<div class="card-body">
						<div class="text-muted small">Stock total</div>
						<div class="fs-4 fw-semibold"
								th:text="${insumo.stockTotal().stripTrailingZeros().toPlainString() + ' ' + unidad}"></div>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="card shadow-sm">
					<div class="card-body">
						<div class="text-muted small">Stock utilizable</div>
						<div class="fs-4 fw-semibold"
								th:text="${insumo.stockUtilizable(hoy).stripTrailingZeros().toPlainString() + ' ' + unidad}"></div>
					</div>
				</div>
			</div>
		</div>

		<div class="alert alert-info" th:if="${insumo.lotes.isEmpty()}">
			Sin lotes registrados
		</div>

		<div th:unless="${insumo.lotes.isEmpty()}">
			<h2 class="h5">Lotes (ordenados por vencimiento, FEFO)</h2>
			<table class="table table-striped align-middle">
				<thead>
					<tr>
						<th>Número de lote</th>
						<th>Cantidad</th>
						<th>Fecha de recepción</th>
						<th>Fecha de vencimiento</th>
						<th>Estado</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="lote : ${insumo.lotes}">
						<td th:text="${lote.numeroLote}"></td>
						<td th:text="${lote.cantidadActual.stripTrailingZeros().toPlainString() + ' ' + unidad}"></td>
						<td th:text="${lote.fechaRecepcion}"></td>
						<td th:text="${lote.fechaVencimiento}"></td>
						<td>
							<span class="badge bg-danger" th:if="${lote.estaVencido(hoy)}">Vencido</span>
							<span class="badge bg-success" th:unless="${lote.estaVencido(hoy)}">Vigente</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
