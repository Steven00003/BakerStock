<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrar insumo — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4" style="max-width: 560px;">
		<h1 class="h4 mb-3">Registrar insumo</h1>

		<div class="alert alert-success" th:if="${param.creado}">
			Insumo registrado con stock 0.
		</div>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/insumos/nuevo}" th:object="${formulario}" method="post" novalidate>
					<div class="mb-3">
						<label for="nombre" class="form-label">Nombre</label>
						<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
						<div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
					</div>
					<div class="mb-3">
						<label for="unidadBase" class="form-label">Unidad base</label>
						<select class="form-select" id="unidadBase" th:field="*{unidadBase}">
							<option value="" disabled>Seleccione una unidad</option>
							<option th:each="u : ${T(com.bakerstock.dominio.UnidadBase).values()}"
									th:value="${u}" th:text="${u}"></option>
						</select>
						<div class="form-text">Todas las cantidades se manejan en esta unidad (g, ml o unidad).</div>
						<div class="text-danger small" th:if="${#fields.hasErrors('unidadBase')}" th:errors="*{unidadBase}"></div>
					</div>
					<div class="mb-3">
						<label for="categoria" class="form-label">Categoría</label>
						<select class="form-select" id="categoria" th:field="*{categoria}">
							<option value="" disabled>Seleccione una categoría</option>
							<option th:each="c : ${T(com.bakerstock.dominio.Categoria).values()}"
									th:value="${c}" th:text="${c}"></option>
						</select>
						<div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
					</div>
					<div class="mb-3">
						<label for="stockMinimo" class="form-label">Stock mínimo</label>
						<input type="number" step="0.001" min="0" class="form-control" id="stockMinimo" th:field="*{stockMinimo}">
						<div class="text-danger small" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
					</div>
					<button type="submit" class="btn btn-primary">Registrar insumo</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
