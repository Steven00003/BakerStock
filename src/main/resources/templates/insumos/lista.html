<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Insumos — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4">
		<h1 class="h4 mb-3">Insumos</h1>

		<form method="get" th:action="@{/insumos}" class="card shadow-sm mb-4">
			<div class="card-body row g-2 align-items-end">
				<div class="col-md-5">
					<label for="q" class="form-label">Buscar por nombre</label>
					<input type="text" class="form-control" id="q" name="q" th:value="${q}"
							placeholder="Ejemplo: harina">
				</div>
				<div class="col-md-4">
					<label for="categoria" class="form-label">Categoría</label>
					<select class="form-select" id="categoria" name="categoria">
						<option value="">Todas las categorías</option>
						<option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
								th:selected="${c.name() == categoria}"></option>
					</select>
				</div>
				<div class="col-md-3">
					<button type="submit" class="btn btn-primary w-100">Buscar</button>
				</div>
			</div>
		</form>

		<div class="alert alert-info" th:if="${insumos.isEmpty()}">
			No se encontraron insumos
		</div>

		<div class="card shadow-sm" th:unless="${insumos.isEmpty()}">
			<table class="table table-striped align-middle mb-0">
				<thead>
					<tr>
						<th>Nombre</th>
						<th>Categoría</th>
						<th>Unidad base</th>
						<th>Stock mínimo</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="insumo : ${insumos}"
							th:with="unidad=${insumo.unidadBase.name() == 'G' ? 'g' : (insumo.unidadBase.name() == 'ML' ? 'ml' : 'unidad')}">
						<td th:text="${insumo.nombre}"></td>
						<td th:text="${insumo.categoria.name()}"></td>
						<td th:text="${unidad}"></td>
						<td th:text="${insumo.stockMinimo.stripTrailingZeros().toPlainString() + ' ' + unidad}"></td>
						<td><a class="btn btn-outline-primary btn-sm" th:href="@{'/insumos/' + ${insumo.id}}">Ver detalle</a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
