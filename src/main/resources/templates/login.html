<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inicio de sesión — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container" style="max-width: 420px;">
		<div class="card mt-5 shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4 text-center">BakerStock · Iniciar sesión</h1>
				<div th:if="${param.error}" class="alert alert-danger py-2">Correo o contraseña incorrectos</div>
				<div th:if="${param.logout}" class="alert alert-success py-2">Sesión cerrada</div>
				<form th:action="@{/login}" method="post">
					<div class="mb-3">
						<label for="username" class="form-label">Correo</label>
						<input type="email" class="form-control" id="username" name="username" required>
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Contraseña</label>
						<input type="password" class="form-control" id="password" name="password" required>
					</div>
					<button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
