<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Usuarios — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h4 mb-0">Usuarios</h1>
			<a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary btn-sm">Nuevo usuario</a>
		</div>

		<div class="alert alert-warning" th:if="${param.error != null}">
			No puedes desactivar tu propia cuenta.
		</div>

		<table class="table table-striped align-middle bg-white shadow-sm">
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Correo</th>
					<th>Rol</th>
					<th>Estado</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="u : ${usuarios}">
					<td th:text="${u.nombre}"></td>
					<td th:text="${u.correo}"></td>
					<td th:text="${u.rol}"></td>
					<td>
						<span class="badge text-bg-success" th:if="${u.activo}">Activa</span>
						<span class="badge text-bg-secondary" th:unless="${u.activo}">Inactiva</span>
					</td>
					<td>
						<form th:if="${u.activo}" th:action="@{/admin/usuarios/{id}/desactivar(id=${u.id})}" method="post" class="d-inline">
							<button type="submit" class="btn btn-outline-danger btn-sm">Desactivar</button>
						</form>
						<form th:unless="${u.activo}" th:action="@{/admin/usuarios/{id}/activar(id=${u.id})}" method="post" class="d-inline">
							<button type="submit" class="btn btn-outline-success btn-sm">Activar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
