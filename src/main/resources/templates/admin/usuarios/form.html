<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nuevo usuario — BakerStock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav th:replace="~{fragmentos/menu :: menu}"></nav>
	<div class="container mt-4" style="max-width: 560px;">
		<h1 class="h4 mb-3">Nuevo usuario</h1>

		<div class="card shadow-sm">
			<div class="card-body">
				<form th:action="@{/admin/usuarios/nuevo}" th:object="${formulario}" method="post" novalidate>
					<div class="mb-3">
						<label for="nombre" class="form-label">Nombre</label>
						<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
						<div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
					</div>
					<div class="mb-3">
						<label for="correo" class="form-label">Correo</label>
						<input type="email" class="form-control" id="correo" th:field="*{correo}">
						<div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
					</div>
					<div class="mb-3">
						<label for="rol" class="form-label">Rol</label>
						<select class="form-select" id="rol" th:field="*{rol}">
							<option value="" disabled>Seleccione un rol</option>
							<option th:each="r : ${T(com.bakerstock.dominio.Rol).values()}"
									th:value="${r}" th:text="${r}"></option>
						</select>
						<div class="text-danger small" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
					</div>
					<div class="mb-3">
						<label for="contrasena" class="form-label">Contraseña</label>
						<input type="password" class="form-control" id="contrasena" th:field="*{contrasena}">
						<div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
						<div class="text-danger small" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
					</div>
					<button type="submit" class="btn btn-primary">Crear usuario</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
